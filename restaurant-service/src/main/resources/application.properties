spring.application.name=restaurant-service
spring.datasource.url=${RESTAURANT_DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=8082

file.upload-dir=${RESTAURANT_UPLOAD_DIR:src/main/resources/uploads}

# file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#eureka.instance.prefer-ip-address=true

app.base-url=${PUBLIC_BASE_URL:http://localhost:8082}
