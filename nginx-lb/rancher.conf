# Rancher Nginx Reverse Proxy (qua Cloudflare Tunnel)
# Bộ lọc động: Tự động bật/tắt Upgrade theo loại Request từ trình duyệt cho Rancher WebSocket (K8s Terminal trên Web UI)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name rancher.myproject.bar;

    location / {
        # Chuyển tiếp tới Rancher Server nội bộ qua HTTPS
        proxy_pass https://192.168.1.115:443;

        # Bỏ qua xác thực chứng chỉ tự ký nội bộ của Rancher
        proxy_ssl_verify off;

        proxy_http_version 1.1;

        # Cấu hình các header cần thiết
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Cấu hình WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
