spring.application.name=user-service
spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=8081

#jwt
jwt.secretKey=${JWT_SECRET}
jwt.expiration=86400000

#openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084/api/v1/notifications}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

file.upload-dir=${USER_UPLOAD_DIR:src/main/resources/uploads}
app.base-url=${PUBLIC_BASE_URL:http://localhost:8081}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
