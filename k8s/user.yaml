apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: food-order
      app.kubernetes.io/component: user-service
  strategy:
    type: RollingUpdate 
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: food-order
        app.kubernetes.io/component: user-service
    spec:
      containers:
        - name: user-service
          image: huongskc/food-order-user-service:v1
          imagePullPolicy: Always # Always pull the image to ensure the latest version is used
          ports:
            - name: user-service
              containerPort: 8081
          env:
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: EUREKA_SERVER_URL
            - name: USER_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: USER_DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: food-order-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-order-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: food-order-secret
                  key: JWT_SECRET
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: FRONTEND_URL
            - name: USER_UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: USER_UPLOAD_DIR
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: PUBLIC_BASE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: food-order-config
                  key: NOTIFICATION_SERVICE_URL
          volumeMounts:
            - name: user-uploads
              mountPath: /app/src/main/resources/uploads
      volumes:
        - name: user-uploads
          persistentVolumeClaim:
            claimName: user-upload-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: user-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: user-service
  ports:
    - name: user-service  
      port: 8081
      targetPort: user-service
