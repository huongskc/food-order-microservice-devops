apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-runner
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: ci-cd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-runner
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: ci-cd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]

  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-runner
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: ci-cd
subjects:
  - kind: ServiceAccount
    name: github-actions-runner
    namespace: food-order
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-runner-token
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: ci-cd
  annotations:
    kubernetes.io/service-account.name: github-actions-runner
type: kubernetes.io/service-account-token
