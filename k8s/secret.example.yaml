# Secret for Food Order Service
apiVersion: v1
kind: Secret
metadata:
  name: food-order-secret
  namespace: food-order
  labels:
    app.kubernetes.io/name: food-order
    app.kubernetes.io/component: configuration
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  DB_USERNAME: "food_order_app"
  DB_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_WITH_A_RANDOM_SECRET"
  SMTP_USERNAME: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME_WITH_A_GMAIL_APP_PASSWORD"
