name: Order Service CI

on:
  push:
    branches:
      - dev
    paths:
      - "order-service/**"
      - ".github/workflows/order-service-ci.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "order-service/**"
      - ".github/workflows/order-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: huongskc/food-order-order-service:${{ github.sha }}

jobs:
  containerize:
    name: Build and Push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./order-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy to Kubernetes
    needs: containerize
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Update order image
        run: |
          kubectl -n food-order set image deployment/order-service order-service=${{ env.DOCKER_IMAGE }}