name: Eureka Service CI

on:
  push:
    branches:
      - dev
    paths:
      - "eureka-service/**"
      - ".github/workflows/eureka-service-ci.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "eureka-service/**"
      - ".github/workflows/eureka-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: huongskc/food-order-eureka-service:${{ github.sha }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./eureka-service/mvnw

      - name: Run unit tests
        working-directory: ./eureka-service
        run: ./mvnw test
        
  containerize:
    name: Build and Push Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./eureka-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy to Kubernetes
    needs: containerize
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Update Eureka image
        run: |
          kubectl -n food-order set image deployment/eureka-service eureka=${{ env.DOCKER_IMAGE }}
